name: Check
on: [push, pull_request]
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.12'
      - working-directory: backend
        run: uv sync --dev --locked
      - working-directory: backend
        run: uv run --no-sync pytest -q
      - working-directory: backend
        run: uv run --no-sync support-workspace-api --help
      - working-directory: backend
        run: uv run --no-sync support-workspace-api --list-cases
      - working-directory: backend
        run: uv build
      - working-directory: backend
        run: uv run --no-sync python ../scripts/check_package.py
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.12'
      - working-directory: backend
        run: uv sync --dev --locked
      - working-directory: frontend
        run: npm ci
      - working-directory: frontend
        run: npm run typecheck
      - working-directory: frontend
        run: npm run build
        env:
          NEXT_PUBLIC_SUPPORT_API_URL: http://127.0.0.1:38123
          NEXT_TELEMETRY_DISABLED: '1'
          COPILOTKIT_TELEMETRY_DISABLED: 'true'
      - working-directory: frontend
        run: npx playwright install --with-deps chromium
      - working-directory: frontend
        run: npm run test:e2e
      - working-directory: frontend
        run: npm run test:chat
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: support-browser-evidence
          path: frontend/test-results/
          retention-days: 7
